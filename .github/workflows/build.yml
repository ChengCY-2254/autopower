name: Build Tweak

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew update
          brew install make ldid xz perl

      - name: Clone Theos
        run: |
          git clone --depth=1 --recurse-submodules https://github.com/theos/theos.git "$THEOS"

      - name: Download iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          cd "$THEOS/sdks"
          echo "下载 iOS 14.5 SDK..."
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz -O
          tar xzf iPhoneOS14.5.sdk.tar.xz
          rm iPhoneOS14.5.sdk.tar.xz
          ls -lh

      - name: Build Release Package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          cd "${{ github.workspace }}"
          make clean
          make package FINALPACKAGE=1 _THEOS_DEB_PACKAGE_CONTROL_PATH="${{ github.workspace }}/control.release"

      - name: Build Debug Package
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$PATH"
          cd "${{ github.workspace }}"
          make clean
          make package _THEOS_DEB_PACKAGE_CONTROL_PATH="${{ github.workspace }}/control.debug"

      - name: List build artifacts
        run: |
          echo "=== 编译产物列表 ==="
          if [ -d "${{ github.workspace }}/packages" ]; then
            ls -lh "${{ github.workspace }}/packages/"
          else
            echo "packages 目录不存在"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopower-debs
          path: packages/*.deb
          retention-days: 30
          if-no-files-found: warn

      - name: Create Release (on tag push)
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') && success()
        with:
          files: packages/*.deb
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
